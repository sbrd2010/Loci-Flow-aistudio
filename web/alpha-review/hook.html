<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Local sync review</title>
<div id="root"></div>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { onAuthStateChanged } from "firebase/auth";
  import { auth } from "/src/firebase.js";
  import { useSync } from "/src/useSync.js";

  function Review() {
    const [user, setUser] = React.useState(null);
    React.useEffect(() => onAuthStateChanged(auth, setUser), []);
    const sync = useSync(user?.uid, user?.email);
    window.review = { ...sync, uid: user?.uid };
    return React.createElement("pre", null, JSON.stringify({
      uid: user?.uid, loading: sync.loading, warning: sync.syncWarning,
      payload: sync.payload,
    }));
  }
  createRoot(document.getElementById("root")).render(React.createElement(Review));
</script></html>
