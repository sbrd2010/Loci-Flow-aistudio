name: Alpha account safety
on:
  pull_request:
    paths:
      - "web/src/**"
      - "web/alpha-review/**"
      - "web/package*.json"
      - "firebase.json"
      - "database.rules.json"
      - "scripts/*staging*"
      - "scripts/preview-deploy-guard.test.mjs"
      - "scripts/deploy-*-rest.mjs"
      - ".github/workflows/firebase-preview.yml"
      - ".github/workflows/alpha-account-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-account-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpha-account-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npm run lint && npm test -- --maxWorkers=3
        working-directory: web
      - name: Check staging and preview deployment isolation
        run: |
          node scripts/prepare-staging-firebase.test.mjs
          node scripts/staging-database-guard.test.mjs
          node scripts/preview-deploy-guard.test.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check day boundaries and merge invariants
        working-directory: web
        run: |
          node_modules/.bin/esbuild alpha-review/logic.test.mjs --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/loci-alpha-logic.test.mjs"
          node --test "$RUNNER_TEMP/loci-alpha-logic.test.mjs"
      - name: Check account safety against local demo emulators
        run: npx --yes --package=firebase-tools@15.22.1 firebase emulators:exec --project demo-loci-review --only auth,database "cd web && npx playwright test --config alpha-review/playwright.config.js --reporter=list"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: alpha-account-safety-results
          path: web/test-results/alpha-review
          retention-days: 3
