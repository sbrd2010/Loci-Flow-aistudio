name: Alpha account safety
on:
  pull_request:
    paths:
      # Sign-in, sync, save, timer and day-boundary code only: other UI
      # changes are covered on the merge to main below, not on every PR push.
      - "web/src/App.jsx"
      - "web/src/main.jsx"
      - "web/src/firebase.js"
      - "web/src/useSync.js"
      - "web/src/hooks/useFocusTimer.js"
      - "web/src/components/SettingsTab.jsx"
      - "web/src/utils/normalizePayload.js"
      - "web/src/utils/resendPolicy.js"
      - "web/src/utils/nativeAuth.js"
      - "web/src/utils/deleteAccount.js"
      - "web/src/utils/aiKeyStorage.js"
      - "web/src/utils/openFocusSession.js"
      - "web/src/utils/focusWindows.js"
      - "web/src/utils/*Clock.js"
      - "web/alpha-review/**"
      - "web/package*.json"
      - "firebase.json"
      - "database.rules.json"
      - ".github/workflows/alpha-account-safety.yml"
  push:
    branches: [main]
    paths:
      - "web/src/**"
      - "web/alpha-review/**"
      - "web/package*.json"
      - "firebase.json"
      - "database.rules.json"
      - ".github/workflows/alpha-account-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-account-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpha-account-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check day boundaries and merge invariants
        working-directory: web
        run: |
          node_modules/.bin/esbuild alpha-review/logic.test.mjs --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/loci-alpha-logic.test.mjs"
          node --test "$RUNNER_TEMP/loci-alpha-logic.test.mjs"
      - name: Check account safety against local demo emulators
        run: npx --yes --package=firebase-tools@15.22.1 firebase emulators:exec --project demo-loci-review --only auth,database "cd web && npx playwright test --config alpha-review/playwright.config.js --reporter=list"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: alpha-account-safety-results
          path: web/test-results/alpha-review
          retention-days: 3
