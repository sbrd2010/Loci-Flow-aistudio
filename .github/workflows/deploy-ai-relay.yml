name: Deploy the AI relay (Cloudflare AI, NVIDIA, OpenRouter, Groq, Ollama, Gemini, Z.ai)

# A button, not an automatic deploy: Actions > this workflow > Run workflow.
# Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as the
# connector, plus AI_NVIDIA_KEY, AI_OPENROUTER_KEY, AI_GROQ_KEY, AI_OLLAMA_KEY, AI_GEMINI_KEY
# and AI_ZAI_KEY (and VITE_GEMINI_MODEL, optional). See docs/ai-relay.md.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-ai-relay
  cancel-in-progress: false

jobs:
  deploy:
    # Production secrets: deploy only what is on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the two Cloudflare secrets are there
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See docs/ai-relay.md."
            exit 1
          fi

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Deploy the Worker
        run: |
          # Without pipefail a failed deploy would pass through tee as a success.
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          {
            echo "## Loci AI relay"
            if [ -n "$url" ]; then
              echo "Relay address: \`$url\`"
              echo ""
              echo "Add it as the repository secret \`VITE_AI_RELAY_URL\` (exactly as shown, no slash at the end),"
              echo "then run **Deploy to Firebase Hosting** so the app picks it up."
            else
              echo "The deploy finished but no address was printed; look in the log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store the provider keys on the Worker
        env:
          AI_NVIDIA_KEY: ${{ secrets.AI_NVIDIA_KEY }}
          AI_OPENROUTER_KEY: ${{ secrets.AI_OPENROUTER_KEY }}
          AI_GROQ_KEY: ${{ secrets.AI_GROQ_KEY }}
          AI_OLLAMA_KEY: ${{ secrets.AI_OLLAMA_KEY }}
          AI_GEMINI_KEY: ${{ secrets.AI_GEMINI_KEY }}
          AI_ZAI_KEY: ${{ secrets.AI_ZAI_KEY }}
          # Not a secret, but stored the same way: the Gemini model to use.
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
        run: |
          for pair in "NVIDIA:AI_NVIDIA_KEY" "OpenRouter:AI_OPENROUTER_KEY" "Groq:AI_GROQ_KEY" "Ollama:AI_OLLAMA_KEY" "Gemini:AI_GEMINI_KEY" "Z.ai:AI_ZAI_KEY"; do
            name="${pair%%:*}"; var="${pair#*:}"
            [ -n "${!var}" ] || echo "$name is not set up: add the repository secret $var and run this again." >> "$GITHUB_STEP_SUMMARY"
          done
          umask 077
          jq -n --arg n "$AI_NVIDIA_KEY" --arg o "$AI_OPENROUTER_KEY" --arg g "$AI_GROQ_KEY" --arg ol "$AI_OLLAMA_KEY" --arg m "$AI_GEMINI_KEY" --arg gm "$VITE_GEMINI_MODEL" --arg z "$AI_ZAI_KEY" \
            '[["NVIDIA_API_KEY",$n],["OPENROUTER_API_KEY",$o],["GROQ_API_KEY",$g],["OLLAMA_API_KEY",$ol],["GEMINI_API_KEY",$m],["GEMINI_MODEL",$gm],["ZAI_API_KEY",$z]]
             | map(.[1] |= gsub("^\\s+|\\s+$"; "")) | map(select(.[1] != "")) | map({(.[0]): .[1]}) | add // {}' \
            > "$RUNNER_TEMP/relay-secrets.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/relay-secrets.json")" = "0" ]; then
            rm -f "$RUNNER_TEMP/relay-secrets.json"
            echo "No keys to store. Cloudflare AI works without one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler secret bulk "$RUNNER_TEMP/relay-secrets.json"
          rm -f "$RUNNER_TEMP/relay-secrets.json"
          echo "Keys stored on the relay." >> "$GITHUB_STEP_SUMMARY"
