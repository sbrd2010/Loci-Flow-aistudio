name: Deploy preview

# A branch on a Firebase Hosting preview channel, for a try-out before merging
# to main. A push to redesign-75 deploys it to the "redesign-75" channel; any
# branch can be deployed on demand (Actions -> Deploy preview -> Run workflow,
# pick the branch and a channel). The live site and the database rules are
# never touched here: only main's workflow deploys those.
# A preview channel still uses the PRODUCTION Firebase Auth and database:
# test it with a disposable account and made-up data only.
on:
  push:
    branches: [ redesign-75 ]
  workflow_dispatch:
    inputs:
      channel:
        description: "Preview channel id (lowercase letters, digits, dashes). Its URL must be an Auth authorized domain for sign-in to work."
        required: true
        default: redesign-75

concurrency:
  group: firebase-preview-${{ inputs.channel || 'redesign-75' }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/redesign-75'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, test, and build web
        working-directory: web
        env:
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
          VITE_AI_RELAY_URL: ${{ secrets.VITE_AI_RELAY_URL }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          npm ci --legacy-peer-deps
          npm test
          npm run build

      - name: Validate deploy script syntax
        run: node --check scripts/deploy-hosting-rest.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCI_FLOW }}
          create_credentials_file: true
          export_environment_variables: true

      # The same REST deploy as main's, to the chosen preview channel (created
      # if missing; each deploy renews its 14-day expiry). The channel id is
      # passed as an env var and validated by the script, never into the shell.
      - name: Deploy Hosting to the preview channel
        env:
          HOSTING_CHANNEL_ID: ${{ inputs.channel || 'redesign-75' }}
        run: |
          set -euo pipefail
          export FIREBASE_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          node scripts/deploy-hosting-rest.mjs
