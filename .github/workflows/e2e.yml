name: E2E Tests

# Robot-minute budget (Nov 2026, private repo on GitHub Free: 2,000 min/month;
# this job is ~18 min): it runs when a PR is marked ready for review (and on
# each push after that), and on every merge to main. Draft pushes skip it:
# the loopcheck and local lint/unit/targeted e2e cover drafts. A newer push
# cancels a PR's still-running run, and changes that cannot affect the web app
# (Markdown, docs, other workflows, ai-proxy, mcp) skip it.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!web/docs/**'
      - '!ai-proxy/**'
      - '!mcp/**'
      - '!.github/workflows/**'
      - '.github/workflows/e2e.yml'
  # redesign-75 collects this round's PRs (73–76) before one merge to main.
  pull_request:
    branches: [main, redesign-75]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!web/docs/**'
      - '!ai-proxy/**'
      - '!mcp/**'
      - '!.github/workflows/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to match firebase-deploy.yml and firebase-rules.yml, which
          # already run Node 22 — keeps all CI workflows on one Node version.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Fails on lint errors only; warnings are printed, not blocking.
      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Remove unrelated apt sources that can break CI (Microsoft package signing)
        # GitHub's ubuntu-latest runner image ships azure-cli and
        # microsoft-prod apt sources by default, unrelated to Playwright.
        # `apt-get update` (run internally by `playwright install --with-deps`)
        # fails outright if any configured repo is unreachable, even ones
        # nothing here needs — and packages.microsoft.com has intermittently
        # served an invalid/unsigned InRelease file ("Clearsigned file isn't
        # valid, got 'NOSPLIT'"), failing this job for reasons that have
        # nothing to do with this repo's code.
        run: sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install Playwright browsers (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server in background
        run: npm run preview &

      - name: Wait for preview server to be ready
        run: |
          echo "Waiting for http://localhost:4173..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not start in time" && exit 1

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
